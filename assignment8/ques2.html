<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tooltip Demo</title>
  <link rel="stylesheet" href="ques2.css" />
</head>
<body>
  <main>
    <div class="tooltip-container">
      <div class="tooltip-item">
        <span class="tooltip-target">🔍</span>
        <span class="tooltip-text">Search Icon Tooltip</span>
      </div>
      <div class="tooltip-item">
        <span class="tooltip-target">💡</span>
        <span class="tooltip-text">Idea Icon Tooltip</span>
      </div>
      <div class="tooltip-item">
        <span class="tooltip-target">📁</span>
        <span class="tooltip-text">Folder Icon Tooltip</span>
      </div>
      <div class="tooltip-item">
        <span class="tooltip-target">Help</span>
        <span class="tooltip-text">Hover for help info</span>
      </div>
    </div>
  </main>
</body>
</html>
