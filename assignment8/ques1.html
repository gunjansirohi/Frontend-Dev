<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pseudo-Class Demonstration</title>
  <link rel="stylesheet" href="ques1.css" />
</head>
<body>
  <header>
    <h1>Pseudo-Class Examples</h1>
  </header>

  <main>
    <section class="examples">
      <div class="example">
        <a href="#" class="pseudo-link">Hover Link</a>
        <p>:hover changes background on mouse over</p>
      </div>

      <div class="example">
        <button class="pseudo-button">Focus Button</button>
        <p>:focus highlights when selected</p>
      </div>

      <div class="example">
        <button class="pseudo-active">Active Button</button>
        <p>:active changes color when clicked</p>
      </div>

      <div class="example">
        <ul class="pseudo-list">
          <li>Item 1</li>
          <li>Item 2</li>
          <li>Item 3</li>
          <li>Item 4</li>
        </ul>
        <p>:nth-child(odd) highlights alternate items</p>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Pseudo-Class Demo</p>
  </footer>
</body>
</html>
