<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Report Page</title>
</head>
<body>
     <h1>Santosh International School</h1>
     <h2>Student Report Card</h2>

  <table border="1" cellpadding="8" cellspacing="0" title="Student Marks Table">
    <thead>
      <tr>
        <th rowspan="2">Subject</th>
        <th colspan="2">Marks</th>
      </tr>
      <tr>
        <th>Obtained</th>
        <th>Out of 100</th>
      </tr>
    </thead>

    <tbody>
      <tr>
        <td>English</td>
        <td>85</td>
        <td>100</td>
      </tr>
      <tr>
        <td>Mathematics</td>
        <td>90</td>
        <td>100</td>
      </tr>
      <tr>
        <td>Science</td>
        <td>88</td>
        <td>100</td>
      </tr>
      <tr>
        <td>Social Studies</td>
        <td>95</td>
        <td>100</td>
      </tr>
      <tr>
        <td>Computer </td>
        <td>82</td>
        <td>100</td>
      </tr>
    </tbody>

    <tfoot>
      <tr>
        <th colspan="1">Total</th>
        <td colspan="2" >440 / 500</td>
      </tr>
      <tr>
        <th colspan="1">Percentage</th>
        <td colspan="2">88%</td>
      </tr>
    </tfoot>
  </table>

</body>
</html>
