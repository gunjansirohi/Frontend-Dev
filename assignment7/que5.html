<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Advanced CSS Selectors</title>
  <link rel="stylesheet" href="que5.css" />
</head>
<body>
  <header>
    <h1>Advanced CSS Selectors Demo</h1>
  </header>

  <main>
    <section>
      <input type="text" placeholder="Text input" />
      <input type="email" placeholder="Email input" />
      <a href="https://example.com">Secure Link</a>
      <a href="http://example.com">Non-secure Link</a>

      <ul class="item-list">
        <li>Item One</li>
        <li>Item Two</li>
        <li>Item Three</li>
        <li>Item Four</li>
      </ul>

      <div class="combinators">
        <div class="parent">
          <p>Descendant Selector</p>
          <span>Child Selector</span>
        </div>
        <div class="sibling">
          <p>Adjacent Sibling</p>
        </div>
        <div class="general-sibling">
          <p>General Sibling</p>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <p>CSS Selectors Showcase</p>
  </footer>
</body>
</html>
