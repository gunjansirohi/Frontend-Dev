<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Multi Step Form</h1>
    <div id="step1">
        <label for="">Name:</label>
        <input type="text" id="name">
        <br><br>
        <button id="next1">Next</button>
    </div>
    <div id="step2">
        <label for="">Email:</label>
        <input type="email" id="email">
        <br><br>
        <button id="back1">Back</button>
        <button id="next2">Next</button>
    </div>
    <div id="step3">
        <label for="">Password:</label>
        <input type="password" id="password">
        <br><br>
        <button id="back2">Back</button>
        <button id="submit">Submit</button>
    </div>
    <div id="summary">
        <h2>Summary</h2>
        <p><strong>Name:</strong><span id="sumname"></span></p>
        <p><strong>Email:</strong><span id="sumemail"></span></p>
        <p><strong>Password:</strong><span id="sumpassword"></span></p>
    </div>
    <script>
        const step1=document.getElementById('step1');
        const step2=document.getElementById('step2');
        const step3=document.getElementById('step3');
        const summary=document.getElementById('summary');

        const nameinput=document.getElementById('name');
        const emailinput=document.getElementById('email');
        const passwordinput=document.getElementById('password');

        document.getAnimations('next1').eventListener(
            'click',()=>{
            if(nameinput.value===""){
                alert("Please enter your name");
            }
            else{
                step1.style.display="none";
                step2.style.display="block";
            }
        });
        document.getElementById("back1").addEventListener("click",()=>{
            step2.style.display="none";
            step1.style.display="block";
        });
        document.getElementById("next2").addEventListener("click",()=>{
            const email=emailinput.value.trim();
            const emailPattern=/^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
            if(emailinput.value===""){
                alert("Please enter your email");
    
            }
            else if(!email.test(emailPattern)){
                alert("Please enter a valid email");
    
            }
            else{
                step2.style.display="none";
                step3.style.display="block";
            }
        });
        document.getElementById("back2").addEventListener("click",()=>{
            step3.style.display="none";
            step2.style.display="block";
        });
        document.getElementById("submit").addEventListener("click",()=>{
            if(passwordinput.value.trim()<6){
                alert("Password must be at least 6 characters long");
    
            }
            else{
                step3.style.display="none";
                summary.style.display="block";
                document.getElementById("sumname").textContent=nameinput.value;
                document.getElementById("sumemail").textContent=emailinput.value;
                document.getElementById("sumpassword").textContent=passwordinput.value;
            }
        });
    </script>
</body>
</html>
