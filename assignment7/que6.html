<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Transformations</title>
  <link rel="stylesheet" href="que6.css" />
</head>
<body>
  <header>
    <h1>CSS Transformations Showcase</h1>
  </header>

  <main>
    <section class="box-container">
      <div class="transform-box rotate">Rotate</div>
      <div class="transform-box scale">Scale</div>
      <div class="transform-box translate">Translate</div>
      <div class="transform-box skew">Skew</div>
    </section>

    <section class="labels">
      <p>Rotate()</p>
      <p>Scale()</p>
      <p>Translate()</p>
      <p>Skew()</p>
    </section>
  </main>

  <footer>
    <p>CSS Transformations Demo</p>
  </footer>
</body>
</html>
